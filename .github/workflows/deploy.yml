name: Deploy Angular Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Angular Application
        run: npm run build

      - name: Prepare GitHub Pages artifacts (404 & nojekyll)
        run: |
          if [ -d "dist/behardikjoshi-portfolio/browser" ]; then
            cp dist/behardikjoshi-portfolio/browser/index.html dist/behardikjoshi-portfolio/browser/404.html || true
            touch dist/behardikjoshi-portfolio/browser/.nojekyll
            echo "DEPLOY_PATH=dist/behardikjoshi-portfolio/browser" >> $GITHUB_ENV
          else
            cp dist/behardikjoshi-portfolio/index.html dist/behardikjoshi-portfolio/404.html || true
            touch dist/behardikjoshi-portfolio/.nojekyll
            echo "DEPLOY_PATH=dist/behardikjoshi-portfolio" >> $GITHUB_ENV
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DEPLOY_PATH }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
